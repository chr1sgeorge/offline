<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OFFLINE ⚠️</title>
    <style>
        body { 
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%); 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: monospace;
            box-sizing: border-box;
            padding: 5vh 5vw; 
        }
        .screen { 
            background-color: #08084A; 
            width: 100%;
            max-width: 900px;
            padding: 60px 40px;
            text-align: center;
            border: 8px dotted #FDEE5F; 
            border-radius: 20px;
            box-shadow: 0 0 30px #FDEE5F, inset 0 0 40px rgba(0,0,0,0.8);
            animation: marquee-flash 1s infinite alternate;
        }
        h1 { 
            color: #FF3366; 
            font-size: 2.8em;
            letter-spacing: 4px;
            margin-bottom: 40px;
            text-shadow: 0 0 10px #fff, 0 0 20px #FF3366, 0 0 40px #FF3366;
            animation: neon-flicker 3s infinite;
        }
        p {
            color: #E5E5E5;
            font-size: 1.4em;
            line-height: 1.8;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.4);
            margin: 20px 0;
        }
        p:last-child {
            color: #FDEE5F;
            font-size: 1.6em;
            font-weight: bold;
            margin-top: 50px;
            text-shadow: 0 0 10px #FDEE5F, 0 0 20px #FDEE5F;
            animation: pulse-glow 1.5s infinite alternate;
        }

        /* Animations */
        @keyframes marquee-flash {
            from { border-color: #FDEE5F; box-shadow: 0 0 20px #FDEE5F, inset 0 0 40px rgba(0,0,0,0.8); }
            to { border-color: #FF3366; box-shadow: 0 0 40px #FF3366, inset 0 0 40px rgba(0,0,0,0.8); }
        }
        
        @keyframes neon-flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% {
                text-shadow: 0 0 10px #fff, 0 0 20px #FF3366, 0 0 40px #FF3366;
                opacity: 1;
            }
            20%, 24%, 55% {
                text-shadow: none;
                opacity: 0.4;
            }
        }

        @keyframes pulse-glow {
            from { text-shadow: 0 0 10px #FDEE5F, 0 0 20px #FDEE5F; transform: scale(1); }
            to { text-shadow: 0 0 20px #FDEE5F, 0 0 40px #FDEE5F; transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="screen">
        <h1>*** SYSTEM OFFLINE ***</h1>
        <p>THE SERVER IS CURRENTLY POWERED DOWN FOR MAINTAINANCE.</p>
        <p>PLEASE TRY AGAIN AFTER A FEW HOURS.</p>
        <p>THANK YOU FOR VISITING!!</p>
    </div>
</body>
</html>
