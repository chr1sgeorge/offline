<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OFFLINE</title>
    <style>
        body { 
            background-color: #4D4DCC; /* Outer retro blue */
            color: #fff; 
            font-family: monospace; 
            text-align: center; 
            padding-top: 15vh; 
            margin: 0; 
            min-height: 100vh;
            box-sizing: border-box;
        }
        .screen { 
            border: 4px solid #000; /* Solid dark borders */
            display: inline-block; 
            padding: 50px 70px; 
            background-color: #08084A; /* Inner dark navy */
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.6); /* Flat blocky shadow */
        }
        h1 { 
            color: #FDEE5F; /* Bright yellow accent */
            text-shadow: 2px 2px 0px #000;
            letter-spacing: 3px;
            margin-bottom: 30px;
            font-size: 2.2em;
        }
        p {
            color: #E5E5E5;
            line-height: 1.8;
            font-size: 1.2em;
            letter-spacing: 1px;
            margin: 15px 0;
        }
        p:last-child {
            color: #FDEE5F; /* Bright yellow accent */
            text-shadow: 2px 2px 0px #000;
            margin-top: 30px;
            font-weight: bold;
            font-size: 1.3em;
        }
    </style>
</head>
<body>
    <div class="screen">
        <h1>*** SYSTEM OFFLINE ***</h1>
        <p>THE SERVER IS CURRENTLY POWERED DOWN FOR MAINTAINANCE.</p>
        <p>PLEASE TRY AGAIN AFTER A FEW HOURS.</p>
        <p>THANK YOU FOR VISITING!!</p>
    </div>
</body>
</html>
