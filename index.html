<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OFFLINE</title>
    <style>
        body { 
            background: radial-gradient(circle, #0b4a1c 0%, #031707 100%); 
            color: #fff; 
            font-family: monospace; 
            text-align: center; 
            padding-top: 15vh; 
            margin: 0; 
            min-height: 100vh;
            box-sizing: border-box;
        }
        .screen { 
            border: 8px double #d4af37; 
            display: inline-block; 
            padding: 50px 70px; 
            background: #111; 
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.4), inset 0 0 20px rgba(212, 175, 55, 0.2); 
        }
        h1 { 
            color: #ff3333; 
            text-shadow: 0 0 10px #ff3333, 0 0 20px #cc0000;
            letter-spacing: 3px;
            margin-bottom: 30px;
            font-size: 2.2em;
        }
        p {
            color: #e5e5e5;
            line-height: 1.8;
            font-size: 1.2em;
            letter-spacing: 1px;
            margin: 15px 0;
        }
        p:last-child {
            color: #d4af37;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
            margin-top: 30px;
            font-weight: bold;
            font-size: 1.3em;
        }
    </style>
</head>
<body>
    <div class="screen">
        <h1>*** SYSTEM OFFLINE ***</h1>
        <p>THE SERVER IS CURRENTLY POWERED DOWN FOR MAINTAINANCE.</p>
        <p>PLEASE TRY AGAIN AFTER A FEW HOURS.</p>
        <p>THANK YOU FOR VISITING!!</p>
    </div>
</body>
</html>
